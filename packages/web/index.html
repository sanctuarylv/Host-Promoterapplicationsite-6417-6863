<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>Join the Sanctuary LV Host + Promoter Team</title>
		<meta
			name="description"
			content="Apply to join the Sanctuary LV Host and Promoter team in Las Vegas. Help create the room, bring your people, and grow with the movement."
		/>
		<meta name="robots" content="index, follow" />
		<meta name="theme-color" content="#0A0A0A" />
		<meta name="color-scheme" content="dark" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />

		<!-- Open Graph / Twitter. Set VITE_SITE_URL in .env so these become absolute URLs. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Sanctuary LV" />
		<meta property="og:title" content="Join the Sanctuary LV Host + Promoter Team" />
		<meta
			property="og:description"
			content="Don't just attend. Help build it. Apply to host, promote, or both."
		/>
		<meta property="og:url" content="%VITE_SITE_URL%/crew" />
		<meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Sanctuary LV — Don't just attend. Help build it." />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Join the Sanctuary LV Host + Promoter Team" />
		<meta
			name="twitter:description"
			content="Don't just attend. Help build it. Apply to host, promote, or both."
		/>
		<meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />
	</head>
	<body class="bg-[#0A0A0A]">
		<div id="root"></div>
		<script type="module" src="/src/web/main.tsx"></script>
	</body>
</html>
